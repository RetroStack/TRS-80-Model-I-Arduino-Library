; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; This env compiles the library and generates IntelliSense data. It does not
; link: src/ is the library, so it has no setup()/loop(). Sketch compilation
; is verified in CI (.github/workflows) against arduino:avr:mega.
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

build_src_filter = 
    +<*>

upload_flags =
	-V
; Note: lib_extra_dirs is searched BEFORE the lib_deps installed under
; .pio/libdeps, so a library present here shadows the pinned version below.
; Kept for the display drivers that are not in lib_deps.
lib_extra_dirs =
    ~/Documents/Arduino/libraries

lib_deps =
	adafruit/Adafruit GFX Library@^1.12.1
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0

lib_ldf_mode = deep+
