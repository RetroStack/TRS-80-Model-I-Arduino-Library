; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; This env compiles the library and generates IntelliSense data. It does not
; link: src/ is the library, so it has no setup()/loop(). Sketch compilation
; is verified in CI (.github/workflows) against arduino:avr:mega.
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

build_src_filter = 
    +<*>

upload_flags =
	-V
; lib_extra_dirs is searched BEFORE the lib_deps installed under .pio/libdeps,
; so anything present here silently replaces the pinned version below with
; whatever happens to be installed locally -- no warning, and a build that does
; not reproduce anywhere else. It is kept only because the display drivers that
; are not in lib_deps have to come from somewhere.
;
; If you are chasing a build difference that CI does not show, this is the first
; thing to rule out: move the offending library out of the Arduino libraries
; folder, or add it to lib_deps with an explicit version so the pin wins.
lib_extra_dirs =
    ~/Documents/Arduino/libraries

; Pinned to the same versions CI installs, so a local build and a CI build
; resolve the same code.
lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit ST7735 and ST7789 Library@1.11.0

lib_ldf_mode = deep+
