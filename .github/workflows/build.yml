name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository; the default token scope is wider.
permissions:
  contents: read

jobs:
  lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/arduino-lint-action@e9a30879471dcbf7d9fe3481b26e60b652cca297 # v1.0.2
        with:
          library-manager: update

  native-tests:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run native tests
        run: make -C extras/test

  compile-examples:
    name: Compile examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/compile-sketches@d7af6619a62e765d91f0a4d65b40cf061537a15d # v1.1.3
        with:
          fqbn: arduino:avr:mega
          sketch-paths: |
            - examples
          libraries: |
            - source-path: ./
            - name: Adafruit GFX Library
              version: 1.12.6
            - name: Adafruit ST7735 and ST7789 Library
              version: 1.11.0
            - name: Adafruit BusIO
              version: 1.17.4
            - name: SD
              version: 1.3.0
          # Informational only: this reports warnings, it does not fail the
          # job. A real gate would mean -Werror, and the Adafruit drivers
          # themselves emit warnings (-Wdelete-non-virtual-dtor among them), so
          # those would have to be quietened first. Read the report on a PR.
          enable-warnings-report: true

  compile-providers:
    name: Compile ${{ matrix.provider }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One sketch per DisplayProvider, so a provider header that cannot
        # compile is caught even though every example defaults to ST7789.
        # Display_ILI9325 is intentionally absent: the library supplying its
        # header is not published, so it cannot be resolved here.
        provider:
          - Display_ST7789_320x240
          - Display_ST7789_240x240
          - Display_ST7789_320x170
          - Display_ST7735
          - Display_ST7796
          - Display_ILI9341
          - Display_HX8357
          - Display_SSD1306
          - Display_SH1106
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate a sketch for ${{ matrix.provider }}
        run: |
          dir="ci-sketches/${{ matrix.provider }}"
          mkdir -p "$dir"
          cat > "$dir/${{ matrix.provider }}.ino" <<'SKETCH'
          #include <PROVIDER.h>
          #include <M1Shield.h>

          PROVIDER displayProvider;

          void setup() {
              M1Shield.begin(displayProvider);
          }

          void loop() {
              M1Shield.loop();
          }
          SKETCH
          sed -i "s/PROVIDER/${{ matrix.provider }}/g" "$dir/${{ matrix.provider }}.ino"
          cat "$dir/${{ matrix.provider }}.ino"

      - uses: arduino/compile-sketches@d7af6619a62e765d91f0a4d65b40cf061537a15d # v1.1.3
        with:
          fqbn: arduino:avr:mega
          sketch-paths: |
            - ci-sketches/${{ matrix.provider }}
          libraries: |
            - source-path: ./
            - name: Adafruit GFX Library
              version: 1.12.6
            - name: Adafruit ST7735 and ST7789 Library
              version: 1.11.0
            - name: Adafruit BusIO
              version: 1.17.4
            - name: Adafruit ILI9341
              version: 1.6.3
            - name: Adafruit HX8357 Library
              version: 1.1.20
            - name: Adafruit SSD1306
              version: 2.5.17
            - name: Adafruit SH110X
              version: 2.1.15
            - name: SD
              version: 1.3.0
